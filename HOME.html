<body>
    <div>
        🏭 半導體 IC 測試機台 — 智慧監控與安全復原系統
        [ 🔄 亂數串流中 ] <!-- 暫時設定，這邊要寫JS -->

    <div>

        <div class="myclass" >
            <table>

                    <th>機台：<span id="tool"></span></th>

                <tr>
                    <th>模式：[<span id="model"></span>]</th>

                    <th>----------------------------------------</span></th>

                    <th>• 合格數量：<span id="qualified_number"></span>顆</th>
                </tr>
                <tr>
                    <th>• 即時良率：<span id="yield"></span>%(<span id="yield_state"></span>)</th>
                </tr>
                <tr>
                    <th>• 機台溫度：<span temperature></span>°C(<span id="temperature_tolerance"></span>)</th>
